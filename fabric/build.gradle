plugins { id 'net.fabricmc.fabric-loom' }

description = '调试物品、命令和服务端快照推送。'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    // /meridian 指令统一注册点（Framework 的 Fabric 模组 meridian_framework），Framework 组合时自动替换为源码工程。
    implementation 'dev.kizuna.meridian:fabric'
    implementation project(':server')
    include project(':server')
    include implementation('local.meridian:server')
    implementation 'dev.kizuna.meridian.technique:server'
    // 版本目录条目是 Provider，implementation 不返回依赖对象，嵌套声明单独写。
    implementation libs.protobuf.java
    include libs.protobuf.java
    // 相邻仓库在 settings 中以源码组合；与原先读单个 JAR 一致只取各模块本身，传递库由完整装配在运行时补齐。
    implementation('dev.kizuna.meridian.human:fabric') { transitive = false }
    implementation('dev.kizuna.meridian.vanilla:fabric') { transitive = false }
    implementation('dev.kizuna.meridian.humanoid:fabric') { transitive = false }
    implementation('dev.kizuna.meridian.technique:fabric') { transitive = false }
    // 观察回执引用 Damage 的纯 Java 类型；运行时由必装 Damage 模组提供。
    compileOnly('dev.kizuna.meridian.vanilla:server') { transitive = false }
    // 复活费用读取必装 Human 的同一内容数据，不复制调试专用常量。
    compileOnly('dev.kizuna.meridian.human:server') { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from(project(':shared').sourceSets.main.resources)
}

apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')

loom {
    mods { meridian_debug { sourceSet sourceSets.main } }
    runs { server { runDir 'build/server' } }
}

// GameTest 只扩展当前模组的测试源集，避免配置期读取尚未生成的自身 JAR。
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

afterEvaluate {
    tasks.named('runGametest') {
        doFirst {
            def runDirectory = file('build/gametest')
            runDirectory.mkdirs()
            new File(runDirectory, 'eula.txt').text = 'eula=true\n'
            new File(runDirectory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
level-type=flat
generate-structures=false
view-distance=2
simulation-distance=2
'''
        }
    }
}

dependencies {
    gametestRuntimeOnly project(':server')
    // 登录假玩家夹具来自功法库的 testFixtures，与功法 fabric 同经源码组合解析。
    gametestImplementation testFixtures('dev.kizuna.meridian.technique:fabric')
}

loom {
    mods {
        meridian_debug_test { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Meridian Debug GameTest'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}
