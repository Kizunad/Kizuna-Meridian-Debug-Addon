plugins {
    id 'base'
    id 'fabric-loom' version '1.6-SNAPSHOT' apply false
}

allprojects {
    group = 'dev.kizuna.meridian.debug'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
    }
}

tasks.named('assemble') {
    dependsOn ':server:assemble', ':fabric:assemble'
}

tasks.named('check') {
    dependsOn ':verification:test', 'checkDocs'
}

tasks.register('test') {
    group = 'verification'
    dependsOn ':verification:test'
}

tasks.register('checkDocs', Exec) {
    group = 'verification'
    commandLine 'python3', '-c',
            'from pathlib import Path; text=Path("README.md").read_text(); assert "meridian_debug:limb_lens" in text'
}
